<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1. Analytics</title>
  <link rel="icon" type="image/svg+xml" href="image/2.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Dark mode init — must be inline and before body to prevent flash -->
  <script>
    (function() {
      const saved = localStorage.getItem('f1-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="39a871e4-0554-4159-bb8d-2d2ced68bd07"></script>
</head>
<body>

  <!-- Top nav: logo + page links + controls -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">F1<span class="nav-dot">.</span></a>
      <div style="flex:1"></div>
      <div class="nav-page-links">
        <a href="index.html" class="nav-page-link active">Analytics</a>
        <a href="about-api.html" class="nav-page-link">Database & APIs</a>
        <a href="about.html" class="nav-page-link">About Us</a>
      </div>
      <div class="nav-controls">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
          <span class="theme-icon-light">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
          </span>
          <span class="theme-icon-dark">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Season selector bar — one step below the nav -->
  <div class="season-bar-wrap">
    <div class="container">
      <div class="season-bar" id="season-bar"></div>
    </div>
  </div>

  <main class="container">
    <div id="content"></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>Jolpica F1 API &amp; Supabase</span>
      <span id="footer-year"></span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
